# environment
environment: "kaggle"  # or "local"

# environments' roots
roots:
    kaggle: "/kaggle/working"
    local: "/home/abdallah_salem/projects/group-activity-recognition"

# dir names
dataset_dir_name : 'dataset'
backbone_dir_name: 'baselines/backbones_checkpoints'

# target frame index
target_frame_idx : 4

# 8-classes / scene level
